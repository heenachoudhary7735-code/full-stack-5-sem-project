<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Lily & Sugar</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Header -->

    <header>

        <a href="shop.html" class="back">
            ← Back to Shop
        </a>

        <div class="logo">

            <h1>Lily & Sugar</h1>

            <p>Freshly baked happiness ♡</p>

        </div>

    </header>


    <!-- Main -->

    <main>


        <!-- Left Side -->

        <div class="image-section">

            <img src="images/bakery.jpg" alt="Bakery">

            <h2>
                Sweet moments<br>
                start here. ♡
            </h2>

        </div>



        <!-- Right Side -->

        <div class="login-section">

            <h2>Join Lily & Sugar ♡</h2>

            <p class="subtitle">
                Create your account and start shopping.
            </p>


            <!-- Register Form -->

            <form id="registerForm">


                <!-- Full Name -->

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >



                <!-- Email -->

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >



                <!-- Password -->

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >



                <!-- Confirm Password -->

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >



                <!-- Terms -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>

                </div>



                <!-- Create Account Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    CREATE ACCOUNT
                </button>

            </form>



            <!-- Login Link -->

            <p class="register">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="register.js"></script>

</body>

</html>
