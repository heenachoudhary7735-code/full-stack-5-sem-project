<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lily & Sugar Bakery - Birthday Cake</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="custom.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="top-header">

            <!-- Search -->
            <div class="search">
                <span>⌕</span>
            </div>


            <!-- LOGO -->

           <div class="logo">
            <img src="./images/logo.png"
                 alt="Lily & Sugar Bakery">
        </div>


            <!-- ICONS -->

            <div class="header-icons">

                <span>♡</span>
                <span>♧</span>
                <span>♙</span>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="navbar">

            <a href="#">MENU</a>

            <a href="#">CUSTOM CAKE</a>

            <a href="#">STORE</a>

            <a href="#">ABOUT US</a>

            <a href="#">FAVOURITES</a>

            <a href="#">CART</a>

        </nav>

    </header>



    <!-- PRODUCT SECTION -->

    <main class="product-container">


        <!-- LEFT IMAGE -->

        <section class="product-image">

            <img src="./images/cake.png" alt="Birthday Cake">

        </section>



        <!-- RIGHT DETAILS -->

        <section class="product-details">

            <p class="small-title">
                EASIFY PRODUCT OPTIONS
            </p>

            <h1>Birthday Cake</h1>

            <p class="price">
                ₹95.00
            </p>



            <!-- QUANTITY -->

            <label>Quantity</label>

            <div class="quantity-box">

                <button id="minus">−</button>

                <span id="quantity">1</span>

                <button id="plus">+</button>

            </div>



            <!-- SIZE + FLAVOR -->

            <div class="row">

                <div class="input-group">

                    <label>Size</label>

                    <select id="size">

                        <option value="0">
                            Classic 4"
                        </option>

                        <option value="20">
                            Classic 6"
                        </option>

                        <option value="40">
                            Classic 8"
                        </option>

                    </select>

                </div>



                <div class="input-group">

                    <label>Flavor</label>

                    <select id="flavor">

                        <option>
                            Chocolate Banana
                        </option>

                        <option>
                            Chocolate
                        </option>

                        <option>
                            Vanilla
                        </option>

                        <option>
                            Strawberry
                        </option>

                        <option>
                            Butterscotch
                        </option>

                    </select>

                </div>

            </div>



            <!-- MESSAGE -->

            <label>
                Write something on the cake
            </label>

            <div class="checkbox">

                <input
                    type="checkbox"
                    id="messageCheck"
                    checked
                >

                <span>Yes</span>

            </div>


            <input
                type="text"
                id="message"
                placeholder="Happy birthday my love!"
                maxlength="30"
            >

            <p class="hint">
                Maximum 30 characters
            </p>



            <!-- TOPPER -->

            <label>Cake topper</label>

            <div class="toppers">

                <div class="topper active">
                    Happy<br>Birthday
                </div>

                <div class="topper">
                    Happy<br>Birthday
                </div>

                <div class="topper">
                    Happy<br>Birthday
                </div>

                <div class="topper">
                    Happy<br>Birthday
                </div>

            </div>



            <!-- CANDLES -->

            <label>
                Do you want pack of candles and knife?
            </label>

            <div class="switch-row">

                <label class="switch">

                    <input
                        type="checkbox"
                        id="candles"
                    >

                    <span class="slider"></span>

                </label>

                <span>Yes</span>

            </div>



            <!-- DELIVERY -->

            <label>Delivery method</label>

            <div class="delivery">

                <label>

                    <input
                        type="radio"
                        name="delivery"
                        value="0"
                        checked
                    >

                    Store pickup

                </label>


                <label>

                    <input
                        type="radio"
                        name="delivery"
                        value="15"
                    >

                    Home delivery (+₹15.00)

                </label>

            </div>



            <!-- DATE -->

            <label>Pickup Date</label>

            <input
                type="date"
                id="date"
            >



            <!-- TIME -->

            <label>Pickup Time</label>

            <input
                type="time"
                id="time"
            >



            <!-- INSTRUCTIONS -->

            <label>
                Special instructions
            </label>

            <textarea
                id="instructions"
                placeholder="Adding special instructions"
            ></textarea>



            <!-- TOTAL -->

            <div class="total">

                <span>Total</span>

                <strong id="total">
                    ₹95.00
                </strong>

            </div>



            <!-- BUTTON -->

            <button
                class="add-button"
                id="addButton"
            >
                ADD TO CART
            </button>

        </section>

    </main>


    <script src="custom.js"></script>

</body>

</html>
