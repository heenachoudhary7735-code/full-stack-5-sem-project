<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Lily & Sugar</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header>

        <a href="store.html" class="back">
            ← Back to Shop
        </a>

        <a href="landing.html" class="logo">
            <img src="./images/logo.png" alt="Lily & Sugar">
        </a>

    </header>


    <main>

        <div class="image-section">

            <div class="image-text">
                <p>WELCOME TO</p>

                <h2>
                    Sweet moments<br>
                    start here. ♡
                </h2>
            </div>

        </div>


        <div class="login-section">

            <p class="section-label">
                WELCOME BACK
            </p>

            <h1>
                Login to Lily & Sugar
            </h1>

            <p class="subtitle">
                Sign in to continue your sweet journey.
            </p>


            <form id="loginForm">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="button" id="showPassword">
                        👁
                    </button>

                </div>


                <a href="forgot-password.html" class="forgot">
                    Forgot password?
                </a>


                <button type="submit" class="login-btn">
                    LOGIN
                </button>

            </form>


            <p class="register">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
