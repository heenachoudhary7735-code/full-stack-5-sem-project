<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sweet Crumbs Bakery</title>

    <link rel="stylesheet" href="./landing.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="hero">

        <div class="logo">
            <i class="fa-solid fa-cake-candles"></i>
            <span>Sweet Crumbs</span>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

            <div class="nav-icons">
                <span>
                    <i class="fa-solid fa-heart"></i>
                </span>

                <span>
                    <i class="fa-solid fa-cart-shopping"></i>
                </span>
            </div>
        </nav>

    </header>


    <!-- Hero Section -->
    <section class="back">
               <div class="back-image">
   <img src="https://tropolite.com/static/front/assets/second1.webp"
     alt="Sweet Crumbs Bakery">
</div>
        <div class="text">
            <h1>Freshly Baked With Love</h1>

            <p>
                Welcome to Sweet Crumbs Bakery!
                Enjoy delicious cakes, pastries and freshly baked treats
                made with love.
            </p>

            <button>Explore Our Menu</button>
        </div>

    </section>


    <!-- Products Section -->
    <section class="tx">

        <h1>The Products Are Mentioned Below</h1>

        <div class="box">

            
            <div class="box1">
                <img src="./images/cheesecake.jpeg"
                     alt="Cheesecake">

                <h2>Cheesecake</h2>
            </div>


            
            <div class="box1">
                <img src="./images/tiramisu.jpeg"
                     alt="Tiramisu">

                <h2>Tiramisu</h2>
            </div>

            
            <div class="box1">
                <img src="./images/butterscotch-cake.jpeg"
                     alt="Butterscotch Cake">

                <h2>Butterscotch Cake</h2>
            </div>



            <div class="box1">
                <img src="./images/pineapple-pestry.jpeg"
                     alt="Pineapple Pastry">

                <h2>Pineapple Pastry</h2>
            </div>


            
            <div class="box1">
                <img src="./images/maca.jpeg"
                     alt="Macarons">

                <h2>Macarons</h2>
            </div>


            
            <div class="box1">
                <img src="./images/garlicbread.jpeg"
                     alt="Garlic Bread">

                <h2>Garlic Bread</h2>
            </div>

        </div>

    </section>


    <script src="./landing.js"></script>

</body>

</html>
